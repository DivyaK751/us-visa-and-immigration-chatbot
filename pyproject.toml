[project]
name = "visa-chatbot"
version = "0.1.0"
description = "US Visa & Immigration Q&A Chatbot"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "google-genai>=0.8.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.3",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
eval = [
    "google-genai>=0.8.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "eval"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
